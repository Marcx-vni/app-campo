<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>App de Campo</title>
<meta name="theme-color" content="#2e7d32" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />
<script src="js/vendor/msal-browser.min.js"></script>
</head>
<body>

  <!-- Tela de login -->
  <div id="screen-login" class="screen">
    <div class="login-box">
      <h1>App de Campo</h1>
      <p class="muted">Controle Sitio EPI 2026</p>
      <button id="btn-login" class="btn btn-primary btn-lg">Entrar com Microsoft</button>
      <p id="login-error" class="error-text"></p>
    </div>
  </div>

  <!-- App principal (após login) -->
  <div id="app-shell" class="hidden">
    <header class="topbar">
      <div>
        <strong id="user-name">—</strong>
        <span id="sync-indicator" class="badge badge-muted">offline</span>
      </div>
      <button id="btn-logout" class="icon-btn" title="Sair">⏻</button>
    </header>

    <main id="main-content"></main>

    <nav class="bottom-nav">
      <button data-route="ordens" class="nav-btn active">
        <span class="nav-icon">📋</span><span>Ordens</span>
      </button>
      <button data-route="apontamento" class="nav-btn">
        <span class="nav-icon">✏️</span><span>Lançar</span>
      </button>
      <button data-route="estoque" class="nav-btn">
        <span class="nav-icon">📦</span><span>Estoque</span>
      </button>
      <button data-route="fila" class="nav-btn">
        <span class="nav-icon">🔄</span><span id="fila-badge-label">Fila</span>
      </button>
    </nav>
  </div>

  <template id="tpl-toast"><div class="toast"></div></template>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/db.js"></script>
  <script src="js/apontamento.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/screens/fileSelector.js"></script>
  <script src="js/screens/ordens.js"></script>
  <script src="js/screens/ordemCard.js"></script>
  <script src="js/screens/apontamentoLivre.js"></script>
  <script src="js/screens/estoque.js"></script>
  <script src="js/screens/fila.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
