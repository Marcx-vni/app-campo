<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>App de Campo</title>
<meta name="theme-color" content="#1F3D2B" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<script src="js/vendor/msal-browser.min.js"></script>
</head>
<body>

  <!-- Tela de login -->
  <div id="screen-login" class="screen">
    <div class="login-box">
      <h1>App de Campo</h1>
      <p class="muted">Controle Sitio 2026</p>
      <button id="btn-login" class="btn btn-primary btn-lg">Entrar com Microsoft</button>
      <p id="login-error" class="error-text"></p>
    </div>
  </div>

  <!-- App principal (após login) -->
  <div id="app-shell" class="hidden">
    <header class="topbar">
      <div class="topbar-main">
        <div class="topbar-info">
          <div id="topbar-data" class="topbar-data">—</div>
          <strong id="topbar-saudacao" class="topbar-saudacao">—</strong>
          <div id="arquivo-atual" class="arquivo-atual" title="Toque para trocar o arquivo do OneDrive"></div>
        </div>
        <div class="topbar-clima">
          <div class="topbar-clima-topo"><span id="clima-icone">⛅</span><span id="clima-temp">—</span></div>
          <div id="clima-cidade" class="topbar-clima-cidade">Venda Nova do Imigrante</div>
          <button id="btn-logout" class="icon-btn topbar-logout" title="Sair">⏻</button>
        </div>
      </div>
      <div class="topbar-status">
        <div id="sync-indicator" class="status-pill">offline</div>
        <span id="app-version" class="app-version"></span>
      </div>
    </header>

    <main id="main-content"></main>

    <nav class="bottom-nav">
      <button data-route="home" class="nav-btn active">
        <span class="nav-icon">🏠</span><span>Início</span>
      </button>
      <button data-route="ferti" class="nav-btn">
        <span class="nav-icon">💧</span><span>Ferti</span>
      </button>
      <button data-route="apontamento" class="nav-btn">
        <span class="nav-icon">✏️</span><span>Lançar</span>
      </button>
      <button data-route="estoque" class="nav-btn">
        <span class="nav-icon">📦</span><span>Estoque</span>
      </button>
      <button data-route="financeiro" class="nav-btn">
        <span class="nav-icon">💰</span><span>Financ.</span>
      </button>
      <button data-route="fila" class="nav-btn">
        <span class="nav-icon">🔄</span><span id="fila-badge-label">Fila</span>
      </button>
    </nav>
  </div>

  <template id="tpl-toast"><div class="toast"></div></template>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/db.js"></script>
  <script src="js/apontamento.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/combobox.js"></script>
  <script src="js/screens/fileSelector.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/fertiConsulta.js"></script>
  <script src="js/screens/ordemCard.js"></script>
  <script src="js/screens/apontamentoLivre.js"></script>
  <script src="js/screens/estoque.js"></script>
  <script src="js/screens/financeiro.js"></script>
  <script src="js/screens/fila.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
